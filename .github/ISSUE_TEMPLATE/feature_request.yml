name: Feature idea
description: Something new the bot could do in a store it already supports, or in its notifications and setup.
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        I read and think through every idea myself. The more of this you fill in, the sooner I can understand it and see how it fits the bot.

        A new store or reward program? Use the [New store or reward](https://github.com/P-Adamiec/Free-Games-Claimer-Remaster/issues/new?template=new_store.yml) form instead.
  - type: checkboxes
    id: newest
    attributes:
      label: Before you suggest it
      options:
        - label: I checked the newest version and the [CHANGELOG](https://github.com/P-Adamiec/Free-Games-Claimer-Remaster/blob/main/CHANGELOG.md), and the bot does not do this yet.
          required: true
        - label: I searched the [open and closed issues](https://github.com/P-Adamiec/Free-Games-Claimer-Remaster/issues?q=is%3Aissue) and nobody suggested it yet.
          required: true
  - type: dropdown
    id: store
    attributes:
      label: Store or part of the bot
      multiple: true
      options:
        - Epic Games
        - Fab
        - Steam
        - Prime Gaming
        - GOG
        - Microsoft Store
        - Microsoft Rewards
        - Ubisoft
        - Unity Asset Store
        - AliExpress
        - Legacy Games
        - Fanatical
        - itch.io
        - IndieGala
        - Alienware Arena
        - GamerPower
        - Notifications
        - Docker, VNC or setup
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What bothers you today
      description: The problem and how often you run into it, with a log line if there is one. For something the bot does not do at all, what you do by hand instead.
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: What you would like the bot to do
      description: What it should do, and what you would see in the log or the notification. A setting name you have in mind is welcome here too.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links that help
      description: A pull request, another project that does this, or a line in our code.
