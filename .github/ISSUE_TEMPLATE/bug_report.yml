name: Bug report
description: The bot does something wrong, or a store stopped working.
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The README section [Something is not working](https://github.com/P-Adamiec/Free-Games-Claimer-Remaster#something-is-not-working-what-to-send-us) shows how to get the log. Passwords, e-mail addresses, tokens, game codes and a public noVNC address are masked in it, but please give it a last look before you attach it.
  - type: checkboxes
    id: newest
    attributes:
      label: Before you report
      options:
        - label: I updated to the newest version (`docker compose pull`, then `docker compose up -d`) and the problem still happens.
          required: true
        - label: I searched the [open and closed issues](https://github.com/P-Adamiec/Free-Games-Claimer-Remaster/issues?q=is%3Aissue) and this is not there yet.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`docker logs fgc-remaster | head -20` shows it in the banner."
      placeholder: v1.15
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store or part of the bot
      multiple: true
      options:
        - Epic Games
        - Fab
        - Steam
        - Prime Gaming
        - GOG
        - Microsoft Store
        - Microsoft Rewards
        - Ubisoft
        - Unity Asset Store
        - AliExpress
        - Legacy Games
        - Fanatical
        - itch.io
        - IndieGala
        - Alienware Arena
        - GamerPower
        - Notifications
        - Docker, VNC or setup
        - Something else
    validations:
      required: true
  - type: input
    id: account
    attributes:
      label: Store account country and language
      description: Some bugs only happen in one language or region.
      placeholder: Germany, German
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the bot did, and what you expected it to do instead.
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When it happens
      options:
        - Every run
        - Since an update
        - Sometimes
        - Only once so far
        - I am not sure
    validations:
      required: true
  - type: input
    id: worked
    attributes:
      label: Last version where it worked
      description: If it broke after an update.
      placeholder: v1.16
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag the whole `fgc.log.txt` in here (`docker logs fgc-remaster --tail 500 > fgc.log.txt`, with your container's name if you changed it, `docker ps` shows it). A few lines between triple backticks can go with the file, not instead of it.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Settings you changed from the defaults (an authenticator key counts, write `EG_OTP_KEY=set`), and where it runs, for example Windows, Linux, a NAS or a Raspberry Pi. Never paste passwords, e-mail addresses, tokens or webhook addresses, write `DISCORD_WEBHOOK=set` instead.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or anything else
      description: A screenshot from `data/screenshots/` or what you saw over VNC. A screenshot can show your account or a game code, so check it first.
