version: 2

updates:
  - package-ecosystem: pip
    directory: /
    # Updates land on dev first, main only moves at release time.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      # No update-types filter: a >= requirement bump has no minor/patch classification,
      # so filtering here left every one of them in a pull request of its own.
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    rebase-strategy: auto
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    rebase-strategy: auto
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      docker-images:
        patterns:
          - "*"
