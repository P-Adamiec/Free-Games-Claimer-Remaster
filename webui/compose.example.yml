# EXAMPLE ONLY: what ./webui/bots.sh writes to docker-compose.override.yml after
#   ./webui/bots.sh add user1 && ./webui/bots.sh add user2
# Do not copy this by hand; the script also creates the per-bot env files it refers to.
# GENERATED by webui/bots.sh from webui/bots/bots.list. Do not edit: run ./webui/bots.sh generate.
# docker compose reads this file automatically next to docker-compose.yml (fork-only).
# Needs Docker Compose 2.24 or newer (!reset / !override).
services:
  # The upstream single bot is replaced by one bot per person below.
  app:
    profiles: ["single"]

  fgc-user1:
    extends:
      file: docker-compose.yml
      service: app
    container_name: fgc-user1
    hostname: fgc-user1
    # No published ports: the web interface proxies this bot's noVNC after login.
    ports: !reset []
    volumes: !override
      - fgc_data_user1:/fgc/data
      - fgc_runlock:/fgc/runlock
    env_file: !override
      - webui/bots/user1.env
    environment:
      FGC_BOT_NAME: "user1"
      FGC_RUN_LOCK_DIR: /fgc/runlock
      FGC_RUN_TIMEOUT_MINUTES: "${FGC_RUN_TIMEOUT_MINUTES:-180}"

  fgc-user2:
    extends:
      file: docker-compose.yml
      service: app
    container_name: fgc-user2
    hostname: fgc-user2
    # No published ports: the web interface proxies this bot's noVNC after login.
    ports: !reset []
    volumes: !override
      - fgc_data_user2:/fgc/data
      - fgc_runlock:/fgc/runlock
    env_file: !override
      - webui/bots/user2.env
    environment:
      FGC_BOT_NAME: "user2"
      FGC_RUN_LOCK_DIR: /fgc/runlock
      FGC_RUN_TIMEOUT_MINUTES: "${FGC_RUN_TIMEOUT_MINUTES:-180}"

  webui:
    build: ./webui
    image: fgc-webui:local
    container_name: fgc-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_BIND:-0.0.0.0}:${WEBUI_PORT:-8090}:8000"
    env_file:
      - .env
    environment:
      FGC_BOTS: "user1,user2"
      WEBUI_DATA_DIR: /webui-data
    volumes:
      - webui_data:/webui-data
      - fgc_runlock:/runlock
      - ./webui/bots:/bots-env:ro
      - fgc_data_user1:/bots/user1
      - fgc_data_user2:/bots/user2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # Only to write config files owned by the bot's user and to read the bot env files.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true

volumes:
  webui_data:
  fgc_runlock:
  fgc_data_user1:
  fgc_data_user2:
